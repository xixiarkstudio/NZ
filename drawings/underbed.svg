<rect x="548.0" y="705.0" width="240.0" height="145.0" fill="#7c6f9b" stroke="#3a3a3a" stroke-width="1.2" /><text x="668.0" y="773.9" font-size="13" text-anchor="middle" fill="#1d1d1d">28寸黑色</text><text x="668.0" y="790.2" font-size="13" text-anchor="middle" fill="#1d1d1d">宽48 × 厚29</text>
<rect x="155.0" y="662.5" width="115.0" height="97.5" fill="#e8e8e8" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="212.5" y="708.2" font-size="11" text-anchor="middle" fill="#1d1d1d">侧槽</text><text x="212.5" y="722.0" font-size="11" text-anchor="middle" fill="#1d1d1d">23×20</text>
<rect x="805.0" y="662.5" width="110.0" height="97.5" fill="#e8e8e8" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="860.0" y="708.2" font-size="11" text-anchor="middle" fill="#1d1d1d">侧槽</text><text x="860.0" y="722.0" font-size="11" text-anchor="middle" fill="#1d1d1d">22×20</text>
<text x="538.5" y="570.0" font-size="13" text-anchor="middle" fill="#7a5a2c" font-weight="bold">三道竖板 = 床的腿</text>
<line x1="284.0" y1="880.0" x2="534.0" y2="880.0" stroke="#b02a2a" stroke-width="1" /><line x1="284.0" y1="875.0" x2="284.0" y2="885.0" stroke="#b02a2a" stroke-width="1" /><line x1="534.0" y1="875.0" x2="534.0" y2="885.0" stroke="#b02a2a" stroke-width="1" /><text x="409.0" y="875.0" font-size="13" text-anchor="middle" fill="#b02a2a">巷道 50</text>
<line x1="543.0" y1="880.0" x2="793.0" y2="880.0" stroke="#b02a2a" stroke-width="1" /><line x1="543.0" y1="875.0" x2="543.0" y2="885.0" stroke="#b02a2a" stroke-width="1" /><line x1="793.0" y1="875.0" x2="793.0" y2="885.0" stroke="#b02a2a" stroke-width="1" /><text x="668.0" y="875.0" font-size="13" text-anchor="middle" fill="#b02a2a">巷道 50</text>
<line x1="944.0" y1="650.0" x2="944.0" y2="850.0" stroke="#b02a2a" stroke-width="1" /><line x1="939.0" y1="650.0" x2="949.0" y2="650.0" stroke="#b02a2a" stroke-width="1" /><line x1="939.0" y1="850.0" x2="949.0" y2="850.0" stroke="#b02a2a" stroke-width="1" /><text x="951.0" y="750.0" font-size="13" text-anchor="middle" fill="#b02a2a" transform="rotate(-90 951.0 750.0)">床面 40</text>
<text x="1000.0" y="170.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">放的顺序</text>
<text x="1000.0" y="196.0" font-size="14" text-anchor="start" fill="#1d1d1d">① 两个 28 寸竖着推到最里面，</text>
<text x="1000.0" y="222.0" font-size="14" text-anchor="start" fill="#1d1d1d">    各走一条巷道。</text>
<text x="1000.0" y="248.0" font-size="14" text-anchor="start" fill="#1d1d1d">② 24 寸、20 寸横放在尾门口。</text>
<text x="1000.0" y="274.0" font-size="14" text-anchor="start" fill="#1d1d1d">③ 脏衣袋放右后角。</text>
<text x="1000.0" y="300.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="1000.0" y="326.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">拿的顺序</text>
<text x="1000.0" y="352.0" font-size="14" text-anchor="start" fill="#1d1d1d">要拿 28 寸，先把外面的</text>
<text x="1000.0" y="378.0" font-size="14" text-anchor="start" fill="#1d1d1d">24 寸或 20 寸拉出来。</text>
<text x="1000.0" y="404.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="1000.0" y="430.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">注意</text>
<text x="1000.0" y="456.0" font-size="14" text-anchor="start" fill="#1d1d1d">24 寸和 28 寸放床下时不能</text>
<text x="1000.0" y="482.0" font-size="14" text-anchor="start" fill="#1d1d1d">扩容，扩容后塞不进。</text>
<text x="1000.0" y="508.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="1000.0" y="534.0" font-size="14" text-anchor="start" fill="#1d1d1d">每个箱子拴一根拉带，</text>
<text x="1000.0" y="560.0" font-size="14" text-anchor="start" fill="#1d1d1d">不用钻进去掏。</text>
</svg>