<text x="38.0" y="808.0" font-size="13.5" text-anchor="start" fill="#b02a2a">1</text>
<text x="93.2" y="808.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">抽屉柜</text>
<text x="249.6" y="808.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">44 × 45 × 67</text>
<text x="424.4" y="808.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">下：浅抽屉，前后约19（让开座椅后的台阶）；上：深抽屉，前后40、内高约36</text>
<text x="1096.0" y="808.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">滑轨 + 按钮锁；台阶高度是估的，量了再定</text>
<text x="38.0" y="838.0" font-size="13.5" text-anchor="start" fill="#b02a2a">2</text>
<text x="93.2" y="838.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">储物柜</text>
<text x="249.6" y="838.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">65 × 45 × 67</text>
<text x="424.4" y="838.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">内宽 62.5；下半截被台阶占掉后面24，上半截深43</text>
<text x="1096.0" y="838.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">对开门 + 按钮锁；放空气炸锅、电煮锅、水壶、锅</text>
<text x="38.0" y="868.0" font-size="13.5" text-anchor="start" fill="#b02a2a">3</text>
<text x="93.2" y="868.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">转角水桶柜</text>
<text x="249.6" y="868.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">62 × 45 × 67</text>
<text x="424.4" y="868.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">清水桶、废水桶各一个，绑带固定</text>
<text x="1096.0" y="868.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">站在车外从右门取；水泵和水管也在这里</text>
<text x="38.0" y="898.0" font-size="13.5" text-anchor="start" fill="#b02a2a">4</text>
<text x="93.2" y="898.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">水槽柜</text>
<text x="249.6" y="898.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">45 × 51 × 67</text>
<text x="424.4" y="898.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">水槽 38 × 38 × 深15；下面净高约 48</text>
<text x="1096.0" y="898.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">门朝过道；放带盖垃圾桶、清洁用品</text>
<text x="38.0" y="928.0" font-size="13.5" text-anchor="start" fill="#b02a2a">5</text>
<text x="93.2" y="928.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">顶柜</text>
<text x="249.6" y="928.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">171 × 22 × 19</text>
<text x="424.4" y="928.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">内高约 16.5，三片推拉板走上下槽</text>
<text x="1096.0" y="928.0" font-size="13.5" text-anchor="start" fill="#1d1d1d">不用合页和撑杆；只放轻的东西；车顶弧度要现场比着做</text>
