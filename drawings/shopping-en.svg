<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1206" viewBox="0 0 1300 1206" font-family="WenQuanYi Zen Hei, Arial, sans-serif">
<rect width="1300" height="1206" fill="#fff"/>
<text x="650.0" y="52" font-size="30" text-anchor="middle" font-weight="bold">Shopping list – camper van bed</text>
