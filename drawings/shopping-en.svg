<line x1="60" y1="956" x2="1240" y2="956" stroke="#ddd"/>
<rect x="60" y="968" width="1180" height="36" fill="#7a5a2c"/><text x="76" y="994" font-size="20" fill="#fff" font-weight="bold">QUESTIONS FOR STAFF</text>
<text x="76" y="1040" font-size="20" fill="#111">Could you please help me find these? My English is limited.</text>
<text x="76" y="1074" font-size="20" fill="#111">Could you cut the two plywood sheets for me, as shown on my cutting sheet?</text>
<text x="76" y="1108" font-size="20" fill="#111">Which driver bit fits these screws?</text>
<text x="76" y="1142" font-size="20" fill="#111">Is this plywood untreated and E0 (low formaldehyde)? It is for sleeping on.</text>
