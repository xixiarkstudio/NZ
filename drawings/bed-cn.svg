<text x="610.0" y="1198.0" font-size="14" text-anchor="start" fill="#1d1d1d">x1</text>
<text x="150.0" y="1241.0" font-size="14" text-anchor="start" fill="#1d1d1d">角码 约50毫米 × 32 个</text>
<text x="150.0" y="1268.0" font-size="14" text-anchor="start" fill="#1d1d1d">平连接片 × 4 片（拼两块 A）</text>
<text x="150.0" y="1295.0" font-size="14" text-anchor="start" fill="#1d1d1d">木螺丝 8g × 16 毫米：进地板、装角码</text>
<text x="150.0" y="1322.0" font-size="14" text-anchor="start" fill="#1d1d1d">木螺丝 8g × 40 毫米：床面板拧进竖板</text>
<text x="880.0" y="990.0" font-size="18" text-anchor="start" fill="#1d1d1d" font-weight="bold">⑤ 组装顺序</text>
<text x="880.0" y="1024.0" font-size="14" text-anchor="start" fill="#1d1d1d">1. 拆旧床，清空，扫地。</text>
<text x="880.0" y="1053.0" font-size="14" text-anchor="start" fill="#1d1d1d">2. 照图①在地板上用铅笔画出 D、C、E 的位置。</text>
<text x="880.0" y="1082.0" font-size="14" text-anchor="start" fill="#1d1d1d">3. 立 3 块 D，每块两面各 2 个角码拧到地板上。</text>
<text x="880.0" y="1111.0" font-size="14" text-anchor="start" fill="#1d1d1d">4. 立 C，贴住 3 块 D 的前端；C 和每块 D、C 和地板都用角码连上。</text>
<text x="880.0" y="1140.0" font-size="14" text-anchor="start" fill="#1d1d1d">5. 把两个 28 寸箱子从尾门推进巷道试一下，能进出再继续。</text>
<text x="880.0" y="1169.0" font-size="14" text-anchor="start" fill="#1d1d1d">6. 盖 2 块 A：先钻 3 毫米引孔，再用 40 的螺丝拧进 D 的板边。</text>
<text x="880.0" y="1198.0" font-size="14" text-anchor="start" fill="#1d1d1d">7. 两块 A 的接缝下面，在竖板之间装 4 片平连接片。</text>
<text x="880.0" y="1227.0" font-size="14" text-anchor="start" fill="#1d1d1d">8. 立 3 块 E 和 F。中间那块 E 要正对 B1、B2 的接缝。</text>
<text x="880.0" y="1256.0" font-size="14" text-anchor="start" fill="#1d1d1d">9. 盖 B1、B2，螺丝拧进 E、F 和 C。</text>
<text x="880.0" y="1285.0" font-size="14" text-anchor="start" fill="#1d1d1d">10. 磨掉毛刺，铺床垫。两个人坐上去、跪上去试。</text>
<text x="880.0" y="1314.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="880.0" y="1343.0" font-size="14" text-anchor="start" fill="#b02a2a">进地板的螺丝只能用 16 毫米的。</text>
<text x="880.0" y="1372.0" font-size="14" text-anchor="start" fill="#b02a2a">C 和中间那块 E 比别的板矮约 6 毫米（锯缝造成的），下面垫平再固定。</text>
</svg>