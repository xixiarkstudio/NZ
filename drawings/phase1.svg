<text x="390.0" y="1166.0" font-size="14" text-anchor="start" fill="#1d1d1d">1200 × 400</text>
<text x="720.0" y="1166.0" font-size="14" text-anchor="start" fill="#1d1d1d">3 块</text>
<text x="120.0" y="1194.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">E</text>
<text x="185.0" y="1194.0" font-size="14" text-anchor="start" fill="#1d1d1d">床脚支腿板</text>
<text x="390.0" y="1194.0" font-size="14" text-anchor="start" fill="#1d1d1d">600 × 400</text>
<text x="720.0" y="1194.0" font-size="14" text-anchor="start" fill="#1d1d1d">3 块</text>
<text x="120.0" y="1222.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold"></text>
<text x="185.0" y="1222.0" font-size="14" text-anchor="start" fill="#1d1d1d">17 毫米胶合板</text>
<text x="390.0" y="1222.0" font-size="14" text-anchor="start" fill="#1d1d1d">2400 × 1200</text>
<text x="720.0" y="1222.0" font-size="14" text-anchor="start" fill="#1d1d1d">2 张</text>
<text x="120.0" y="1250.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold"></text>
<text x="185.0" y="1250.0" font-size="14" text-anchor="start" fill="#1d1d1d">角码（约 50 毫米）</text>
<text x="390.0" y="1250.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="720.0" y="1250.0" font-size="14" text-anchor="start" fill="#1d1d1d">30 个</text>
<text x="120.0" y="1278.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold"></text>
<text x="185.0" y="1278.0" font-size="14" text-anchor="start" fill="#1d1d1d">平连接片（拼接床面用）</text>
<text x="390.0" y="1278.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="720.0" y="1278.0" font-size="14" text-anchor="start" fill="#1d1d1d">4 片</text>
<text x="120.0" y="1306.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold"></text>
<text x="185.0" y="1306.0" font-size="14" text-anchor="start" fill="#1d1d1d">木螺丝</text>
<text x="390.0" y="1306.0" font-size="14" text-anchor="start" fill="#1d1d1d">8g × 16 一盒；8g × 40 一盒</text>
<text x="720.0" y="1306.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="120.0" y="1334.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold"></text>
<text x="185.0" y="1334.0" font-size="14" text-anchor="start" fill="#1d1d1d">工具</text>
<text x="390.0" y="1334.0" font-size="14" text-anchor="start" fill="#1d1d1d">充电电钻、3 毫米钻头、十字批头、铅笔、砂纸</text>
<text x="720.0" y="1334.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="860.0" y="1050.0" font-size="17" text-anchor="start" fill="#1d1d1d" font-weight="bold">⑤ 组装顺序</text>
<text x="860.0" y="1082.0" font-size="14" text-anchor="start" fill="#1d1d1d">1. 拆掉旧床架，清空，地板扫干净。</text>
<text x="860.0" y="1110.0" font-size="14" text-anchor="start" fill="#1d1d1d">2. 用卷尺和铅笔在地板上画出每块竖板的位置（照图①）。</text>
<text x="860.0" y="1138.0" font-size="14" text-anchor="start" fill="#1d1d1d">3. 立 3 块 D：每块两面各用 2 个角码固定在地板上。</text>
<text x="860.0" y="1166.0" font-size="14" text-anchor="start" fill="#1d1d1d">4. 立 C：贴着 3 块 D 的前端，用角码把 C 和每块 D、和地板连起来。</text>
<text x="860.0" y="1194.0" font-size="14" text-anchor="start" fill="#1d1d1d">5. 把两个 28 寸箱子从尾门推进去试一下，能进出再往下做。</text>
<text x="860.0" y="1222.0" font-size="14" text-anchor="start" fill="#1d1d1d">6. 盖 2 块 A：先钻 3 毫米引孔，再用 40 的螺丝拧进 D 的板边，每条边 5 颗。</text>
<text x="860.0" y="1250.0" font-size="14" text-anchor="start" fill="#1d1d1d">7. 两块 A 的接缝下面，在竖板之间装 4 片平连接片。</text>
<text x="860.0" y="1278.0" font-size="14" text-anchor="start" fill="#1d1d1d">8. 立 3 块 E（中间那块放在 B1 和 B2 的接缝正下方），用角码固定。</text>
<text x="860.0" y="1306.0" font-size="14" text-anchor="start" fill="#1d1d1d">9. 盖 B1、B2，螺丝拧进 E 和 C。</text>
<text x="860.0" y="1334.0" font-size="14" text-anchor="start" fill="#1d1d1d">10. 外露的边用砂纸磨一下，铺上床垫。</text>
<text x="860.0" y="1362.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="860.0" y="1390.0" font-size="14" text-anchor="start" fill="#b02a2a">进地板的螺丝只能用 16 毫米的，再长会打穿地板碰到车身铁皮。</text>
<text x="860.0" y="1418.0" font-size="14" text-anchor="start" fill="#b02a2a">床面高约 42 厘米、宽 150、长 180；Queen 床垫铺上去，前面探出 10 厘米。</text>
</svg>