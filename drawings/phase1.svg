<text x="860.0" y="992.0" font-size="13" text-anchor="start" fill="#555">裁 7 刀：先横裁两刀成 3 条 400 宽的长条（第 3 条会因为锯缝窄几毫米），</text>
<text x="860.0" y="1012.0" font-size="13" text-anchor="start" fill="#555">再按图截长度。窄的那条出 C 和中间那块 E，装的时候 E 下面垫平。</text>
<text x="120.0" y="1050.0" font-size="17" text-anchor="start" fill="#1d1d1d" font-weight="bold">④ 要买的东西</text>
<text x="120.0" y="1082.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">A</text>
<text x="185.0" y="1082.0" font-size="14" text-anchor="start" fill="#1d1d1d">固定床面</text>
<text x="390.0" y="1082.0" font-size="14" text-anchor="start" fill="#1d1d1d">1500 × 600</text>
<text x="720.0" y="1082.0" font-size="14" text-anchor="start" fill="#1d1d1d">2 块</text>
<text x="120.0" y="1110.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">B1 B2</text>
<text x="185.0" y="1110.0" font-size="14" text-anchor="start" fill="#1d1d1d">床脚面板</text>
<text x="390.0" y="1110.0" font-size="14" text-anchor="start" fill="#1d1d1d">900 × 600、600 × 600</text>
<text x="720.0" y="1110.0" font-size="14" text-anchor="start" fill="#1d1d1d">各 1 块</text>
<text x="120.0" y="1138.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">C</text>
<text x="185.0" y="1138.0" font-size="14" text-anchor="start" fill="#1d1d1d">横挡板</text>
<text x="390.0" y="1138.0" font-size="14" text-anchor="start" fill="#1d1d1d">1500 × 394</text>
<text x="720.0" y="1138.0" font-size="14" text-anchor="start" fill="#1d1d1d">1 块</text>
<text x="120.0" y="1166.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">D</text>
