<rect x="125.0" y="540.0" width="705.0" height="30.0" fill="#a9bccb" stroke="#3a3a3a" stroke-width="1.2" /><text x="477.5" y="559.2" font-size="12" text-anchor="middle" fill="#1d1d1d">小珵的床垫 40 × 143</text>
<rect x="835.0" y="420.0" width="175.0" height="350.0" fill="#c7a06c" stroke="#3a3a3a" stroke-width="1.2" /><text x="922.5" y="591.7" font-size="12" text-anchor="middle" fill="#1d1d1d">矮柜</text><text x="922.5" y="606.7" font-size="12" text-anchor="middle" fill="#1d1d1d">高70</text>
