<rect x="470.0" y="147.5" width="360.0" height="126.0" fill="#f6ecd6" stroke="#3a3a3a" stroke-width="1.2" /><text x="650.0" y="214.7" font-size="12" text-anchor="middle" fill="#1d1d1d">推拉门</text>
<circle cx="230.0" cy="170.0" r="6" fill="#b02a2a"/>
<circle cx="395.0" cy="170.0" r="6" fill="#b02a2a"/>
<circle cx="570.0" cy="170.0" r="6" fill="#b02a2a"/>
<circle cx="745.0" cy="170.0" r="6" fill="#b02a2a"/>
<rect x="314.0" y="134.0" width="12" height="12" fill="#b02a2a"/>
<rect x="639.0" y="134.0" width="12" height="12" fill="#b02a2a"/>
<line x1="655.0" y1="300.0" x2="805.0" y2="300.0" stroke="#333" stroke-width="4" />
<text x="730.0" y="325.0" font-size="12" text-anchor="middle" fill="#1d1d1d">挂杆</text>
<line x1="130.0" y1="109.0" x2="835.0" y2="109.0" stroke="#b02a2a" stroke-width="1" /><line x1="130.0" y1="104.0" x2="130.0" y2="114.0" stroke="#b02a2a" stroke-width="1" /><line x1="835.0" y1="104.0" x2="835.0" y2="114.0" stroke="#b02a2a" stroke-width="1" /><text x="482.5" y="104.0" font-size="13" text-anchor="middle" fill="#b02a2a">吊柜长 141 · 深30</text>
<line x1="851.0" y1="140.0" x2="851.0" y2="285.0" stroke="#b02a2a" stroke-width="1" /><line x1="846.0" y1="140.0" x2="856.0" y2="140.0" stroke="#b02a2a" stroke-width="1" /><line x1="846.0" y1="285.0" x2="856.0" y2="285.0" stroke="#b02a2a" stroke-width="1" /><text x="858.0" y="212.5" font-size="13" text-anchor="middle" fill="#b02a2a" transform="rotate(-90 858.0 212.5)">高29</text>
<line x1="420.0" y1="285.0" x2="420.0" y2="540.0" stroke="#b02a2a" stroke-width="1" /><line x1="415.0" y1="285.0" x2="425.0" y2="285.0" stroke="#b02a2a" stroke-width="1" /><line x1="415.0" y1="540.0" x2="425.0" y2="540.0" stroke="#b02a2a" stroke-width="1" /><text x="413.0" y="412.5" font-size="13" text-anchor="middle" fill="#b02a2a" transform="rotate(-90 413.0 412.5)">离床垫 51</text>
<text x="1090.0" y="140.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">三重固定</text>
<text x="1090.0" y="166.0" font-size="14" text-anchor="start" fill="#1d1d1d">① 两头的竖板（棕色）落在床板上，</text>
<text x="1090.0" y="192.0" font-size="14" text-anchor="start" fill="#1d1d1d">    重量压在腿上，不靠螺丝吊。</text>
<text x="1090.0" y="218.0" font-size="14" text-anchor="start" fill="#1d1d1d">② 红色圆点：背面 4 颗 M6 螺栓，</text>
<text x="1090.0" y="244.0" font-size="14" text-anchor="start" fill="#1d1d1d">    用拉铆螺母打在车身竖梁上。</text>
<text x="1090.0" y="270.0" font-size="14" text-anchor="start" fill="#1d1d1d">③ 红色方块：顶面 2 颗 M6 螺栓，</text>
<text x="1090.0" y="296.0" font-size="14" text-anchor="start" fill="#1d1d1d">    固定在车顶横梁上。</text>
<text x="1090.0" y="322.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="1090.0" y="348.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">做法</text>
<text x="1090.0" y="374.0" font-size="14" text-anchor="start" fill="#1d1d1d">柜体用 9 毫米板，越轻越好。</text>
<text x="1090.0" y="400.0" font-size="14" text-anchor="start" fill="#1d1d1d">只放衣服，装满约 10–15 公斤。</text>
<text x="1090.0" y="426.0" font-size="14" text-anchor="start" fill="#1d1d1d">推拉门走上下槽，不会自己开。</text>
<text x="1090.0" y="452.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="1090.0" y="478.0" font-size="15" text-anchor="start" fill="#b02a2a" font-weight="bold">装好后的检验</text>
<text x="1090.0" y="504.0" font-size="14" text-anchor="start" fill="#1d1d1d">两手抓住柜底，把体重挂上去，</text>
<text x="1090.0" y="530.0" font-size="14" text-anchor="start" fill="#1d1d1d">纹丝不动才算合格。</text>
<text x="1090.0" y="556.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="1090.0" y="582.0" font-size="14" text-anchor="start" fill="#1d1d1d">梁的位置要到车上实际找，</text>
<text x="1090.0" y="608.0" font-size="14" text-anchor="start" fill="#1d1d1d">图上的螺栓位置只是示意。</text>
</svg>