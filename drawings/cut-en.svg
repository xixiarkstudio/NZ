<text x="150.0" y="1406.0" font-size="15" text-anchor="start" fill="#333">7 cuts. First cuts 1 and 2 make three strips 400 wide; then cross-cut each strip as shown.</text>
<text x="150.0" y="1430.0" font-size="15" text-anchor="start" fill="#333">IMPORTANT: the first two strips must both be exactly 400 wide. The third strip will be a few mm narrower – that is fine.</text>
<text x="150.0" y="1500.0" font-size="15" text-anchor="start" fill="#1d1d1d" font-weight="bold">Every cut is on a 100 mm increment. No piece is shorter than 600 except the two 300 offcuts. 18 mm plywood is also OK.</text>
<text x="150.0" y="1528.0" font-size="15" text-anchor="start" fill="#1d1d1d">I will take all pieces and offcuts with me. Thank you!</text>
