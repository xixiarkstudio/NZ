<text x="150.0" y="1241.0" font-size="14" text-anchor="start" fill="#1d1d1d">Angle brackets ~50 mm  x32</text>
<text x="150.0" y="1268.0" font-size="14" text-anchor="start" fill="#1d1d1d">Flat mending plates  x4 (join the two A panels)</text>
<text x="150.0" y="1295.0" font-size="14" text-anchor="start" fill="#1d1d1d">Wood screws 8g x 16 mm: brackets and floor</text>
<text x="150.0" y="1322.0" font-size="14" text-anchor="start" fill="#1d1d1d">Wood screws 8g x 40 mm: top panels into board edges</text>
<text x="880.0" y="990.0" font-size="18" text-anchor="start" fill="#1d1d1d" font-weight="bold">5. Assembly order</text>
<text x="880.0" y="1024.0" font-size="14" text-anchor="start" fill="#1d1d1d">1. Remove the old bed, clear and sweep the floor.</text>
<text x="880.0" y="1053.0" font-size="14" text-anchor="start" fill="#1d1d1d">2. Mark the positions of D, C and E on the floor (see view 1).</text>
<text x="880.0" y="1082.0" font-size="14" text-anchor="start" fill="#1d1d1d">3. Stand the three D boards; 2 brackets each side into the floor.</text>
<text x="880.0" y="1111.0" font-size="14" text-anchor="start" fill="#1d1d1d">4. Stand C against the front ends of the D boards; bracket C to each D and to the floor.</text>
<text x="880.0" y="1140.0" font-size="14" text-anchor="start" fill="#1d1d1d">5. Test: slide both 28-inch suitcases into the lanes from the tailgate.</text>
<text x="880.0" y="1169.0" font-size="14" text-anchor="start" fill="#1d1d1d">6. Fit the two A panels: 3 mm pilot holes, then 40 mm screws into the D board edges.</text>
<text x="880.0" y="1198.0" font-size="14" text-anchor="start" fill="#1d1d1d">7. Under the joint between the A panels, fit 4 flat plates between the boards.</text>
<text x="880.0" y="1227.0" font-size="14" text-anchor="start" fill="#1d1d1d">8. Stand the three E boards and F. The middle E sits under the B1/B2 joint.</text>
<text x="880.0" y="1256.0" font-size="14" text-anchor="start" fill="#1d1d1d">9. Fit B1 and B2; screw into E, F and C.</text>
<text x="880.0" y="1285.0" font-size="14" text-anchor="start" fill="#1d1d1d">10. Sand sharp edges, put the mattress on, test by sitting and kneeling.</text>
<text x="880.0" y="1314.0" font-size="14" text-anchor="start" fill="#1d1d1d"></text>
<text x="880.0" y="1343.0" font-size="14" text-anchor="start" fill="#b02a2a">Floor screws must be 16 mm only.</text>
<text x="880.0" y="1372.0" font-size="14" text-anchor="start" fill="#b02a2a">C and one E are ~6 mm lower (saw kerf): pack them level before fixing.</text>
</svg>