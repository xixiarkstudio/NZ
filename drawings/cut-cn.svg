<text x="150.0" y="1430.0" font-size="15" text-anchor="start" fill="#333">重要：前两条必须正好 400 宽。第 3 条会窄几毫米，没关系。</text>
<text x="150.0" y="1500.0" font-size="15" text-anchor="start" fill="#1d1d1d" font-weight="bold">所有尺寸都是 100 毫米的整数；除两块 300 的余料外，没有短于 600 的板。18 毫米板也可以。</text>
<text x="150.0" y="1528.0" font-size="15" text-anchor="start" fill="#1d1d1d">我要带走所有的板和余料。</text>
